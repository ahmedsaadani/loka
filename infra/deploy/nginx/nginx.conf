# Configuration nginx principale (prod Loka). Les serveurs virtuels sont dans
# /etc/nginx/conf.d/default.conf, rendu depuis /etc/nginx/templates/*.template
# par l'entrypoint de l'image officielle (envsubst sur ${DOMAIN}).

user  nginx;
worker_processes  auto;
pid        /var/run/nginx.pid;
error_log  /var/log/nginx/error.log warn;

events {
    worker_connections  2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    server_tokens      off;
    types_hash_max_size 2048;

    # Taille max des uploads (photos de biens, pièces d'identité).
    client_max_body_size 25m;

    # Résolution DNS interne de Docker : permet à nginx de démarrer même si un
    # conteneur amont (api, web, minio) n'est pas encore joignable.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Limitation de débit sur les endpoints d'authentification (10 req/min par IP).
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_status 429;

    # Compression (gzip uniquement, brotli non requis).
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff2;

    # En-têtes transmis aux applications.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/conf.d/*.conf;
}
