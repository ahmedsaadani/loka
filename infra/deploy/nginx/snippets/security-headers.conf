# En-têtes de sécurité. À inclure dans CHAQUE location qui déclare un add_header
# (nginx n'hérite pas des add_header du bloc parent dès qu'un location en définit un).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(), usb=()" always;
