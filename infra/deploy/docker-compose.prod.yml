# ---------------------------------------------------------------------------
# Loka — stack de production sur un seul VPS (Ubuntu 22.04 / 24.04).
#
# Utilisation (depuis /opt/loka) :
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d
# ou, de préférence, via ./deploy.sh (pull, migrations, collectstatic, health, rollback).
#
# Seul nginx publie des ports (80/443). Tout le reste communique sur le réseau
# interne `loka_default`. Les images api/web sont construites par la CI et tirées
# depuis le registre GitLab (${REGISTRY_IMAGE}/api:${IMAGE_TAG}).
#
# Stockage : soit un S3 externe (rien à faire), soit MinIO auto-hébergé en activant
# le profil `minio` (COMPOSE_PROFILES=minio dans .env.prod). Dans ce cas nginx
# expose les buckets en lecture sous https://${DOMAIN}/media/.
# ---------------------------------------------------------------------------
name: loka

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-api-common: &api-common
  image: ${REGISTRY_IMAGE}/api:${IMAGE_TAG}
  env_file: .env.prod
  restart: unless-stopped
  logging: *default-logging
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  # ------------------------------------------------------------------ edge
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      # Seule ${DOMAIN} est substituée par envsubst : les $variables nginx sont préservées.
      NGINX_ENVSUBST_FILTER: "^DOMAIN$$"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      # NGINX_TEMPLATE=bootstrap.conf.template est utilisé par init-letsencrypt.sh
      # tant que le premier certificat n'existe pas.
      - ./nginx/conf.d/${NGINX_TEMPLATE:-loka.conf.template}:/etc/nginx/templates/default.conf.template:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
      - django_static:/var/www/django-static:ro
    # Recharge nginx toutes les 6 h pour prendre en compte les certificats renouvelés par certbot.
    entrypoint:
      - /bin/sh
      - -c
      - '(while :; do sleep 6h; nginx -s reload; done) & exec /docker-entrypoint.sh nginx -g "daemon off;"'
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      - api
      - web

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # Boucle de renouvellement (certbot ne renouvelle que si < 30 jours de validité).
    entrypoint:
      - /bin/sh
      - -c
      - 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'

  # ------------------------------------------------------------------ application
  api:
    <<: *api-common
    command:
      - gunicorn
      - config.wsgi:application
      - --bind=0.0.0.0:8000
      - --workers=${GUNICORN_WORKERS:-3}
      - --timeout=60
      - --access-logfile=-
      - --error-logfile=-
    volumes:
      # Sortie de `collectstatic`, servie par nginx sous /django-static/.
      - django_static:/app/staticfiles
    # L'admin Django (/admin/ côté API) n'est pas exposé : voir docs/deploy.md « Admin Django ».
    healthcheck:
      # L'image python:3.12-slim n'embarque pas curl : on utilise urllib. L'en-tête
      # X-Forwarded-Proto évite la redirection HTTPS de SECURE_SSL_REDIRECT.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; q=urllib.request.Request('http://localhost:8000/api/v1/health/', headers={'X-Forwarded-Proto': 'https'}); r=urllib.request.urlopen(q, timeout=5); sys.exit(0 if r.status==200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  worker:
    <<: *api-common
    command: celery -A config.celery worker -l info --concurrency=${CELERY_CONCURRENCY:-2}
    healthcheck:
      test: ["CMD-SHELL", "celery -A config.celery inspect ping -d celery@$$HOSTNAME --timeout 10 || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s

  beat:
    <<: *api-common
    command: >
      celery -A config.celery beat -l info
      --scheduler celery.beat:PersistentScheduler
      --schedule /var/lib/celery/beat-schedule
      --pidfile=
    volumes:
      - celery_beat:/var/lib/celery

  web:
    image: ${REGISTRY_IMAGE}/web:${IMAGE_TAG}
    env_file: .env.prod
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # node:22-alpine embarque wget (busybox).
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ------------------------------------------------------------------ données
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-loka}
      POSTGRES_USER: ${POSTGRES_USER:-loka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-loka} -d ${POSTGRES_DB:-loka}"]
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 256m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  # ------------------------------------------------------------------ stockage (optionnel)
  # Activer avec COMPOSE_PROFILES=minio. Sinon, utiliser un S3 externe (S3_ENDPOINT_URL).
  minio:
    image: quay.io/minio/minio:latest
    profiles: ["minio"]
    restart: unless-stopped
    logging: *default-logging
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
      # Les URLs signées doivent être générées pour l'hôte public (https://DOMAIN/media).
      MINIO_SERVER_URL: ${S3_PUBLIC_ENDPOINT_URL:-https://${DOMAIN}/media}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10

  minio-init:
    image: quay.io/minio/mc:latest
    profiles: ["minio"]
    logging: *default-logging
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY} &&
      mc mb --ignore-existing local/${S3_BUCKET_PUBLIC:-loka-public} &&
      mc mb --ignore-existing local/${S3_BUCKET_PRIVATE:-loka-private} &&
      mc anonymous set download local/${S3_BUCKET_PUBLIC:-loka-public} &&
      mc anonymous set none local/${S3_BUCKET_PRIVATE:-loka-private} &&
      echo 'buckets ready'
      "

volumes:
  postgres_data:
  redis_data:
  letsencrypt:
  certbot_www:
  django_static:
  celery_beat:
  minio_data:
