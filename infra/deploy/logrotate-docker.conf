# Rotation des logs json-file de Docker (filet de sécurité).
# Le compose limite déjà chaque conteneur à 5 x 10 Mo (logging.options). Ce fichier
# couvre les conteneurs lancés hors compose (docker run, one-off) et les cas où
# les limites ne suffisent pas.
#
# Installation :  sudo cp logrotate-docker.conf /etc/logrotate.d/docker
# Test :          sudo logrotate -d /etc/logrotate.d/docker
/var/lib/docker/containers/*/*.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    dateext
}
