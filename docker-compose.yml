# Stack de développement Loka.
# `make dev` ou `powershell -File scripts/dev.ps1 dev`
name: loka

x-api-common: &api-common
  build:
    context: ./apps/api
    dockerfile: ../../infra/docker/api.Dockerfile
    target: dev
  env_file: .env
  volumes:
    - ./apps/api:/app
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-loka}
      POSTGRES_USER: ${POSTGRES_USER:-loka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loka}
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-loka} -d ${POSTGRES_DB:-loka}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-loka}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-loka-minio-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Crée les deux buckets : public (lecture anonyme) et private (URLs signées uniquement).
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-loka} ${S3_SECRET_KEY:-loka-minio-secret} &&
      mc mb --ignore-existing local/${S3_BUCKET_PUBLIC:-loka-public} &&
      mc mb --ignore-existing local/${S3_BUCKET_PRIVATE:-loka-private} &&
      mc anonymous set download local/${S3_BUCKET_PUBLIC:-loka-public} &&
      mc anonymous set none local/${S3_BUCKET_PRIVATE:-loka-private} &&
      echo 'buckets ready'
      "

  api:
    <<: *api-common
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"

  worker:
    <<: *api-common
    command: celery -A config.celery worker -l info --concurrency=2

  web:
    build:
      context: ./apps/web
      dockerfile: ../../infra/docker/web.Dockerfile
      target: dev
    env_file: .env
    command: npm run dev
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
  web_node_modules:
  web_next:
