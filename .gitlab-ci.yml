# Pipeline Loka : lint -> test -> build -> deploy (manuel)
stages: [lint, test, build, deploy]

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"
  DOCKER_TLS_CERTDIR: "/certs"

.api-base:
  image: python:3.12-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends gdal-bin libgdal-dev libgeos-dev libproj-dev libpq-dev build-essential > /dev/null
    - cd apps/api
    - pip install -r requirements/dev.txt
  cache:
    key: api-${CI_COMMIT_REF_SLUG}
    paths: [.cache/pip]
  rules:
    - changes: [apps/api/**/*, .gitlab-ci.yml]

.web-base:
  image: node:22-alpine
  before_script:
    - cd apps/web
    - npm ci
  cache:
    key: web-${CI_COMMIT_REF_SLUG}
    paths: [.cache/npm]
  rules:
    - changes: [apps/web/**/*, .gitlab-ci.yml]

lint:api:
  extends: .api-base
  stage: lint
  script:
    - ruff check .
    - ruff format --check .
    - mypy .

lint:web:
  extends: .web-base
  stage: lint
  script:
    - npm run lint
    - npm run format:check
    - npm run typecheck

security:api:
  extends: .api-base
  stage: lint
  script:
    - bandit -q -r . -c pyproject.toml
    - pip-audit -r requirements/base.txt --strict

security:web:
  extends: .web-base
  stage: lint
  script:
    - npm audit --omit=dev --audit-level=high

test:api:
  extends: .api-base
  stage: test
  services:
    - name: postgis/postgis:16-3.4
      alias: postgres
    - name: redis:7-alpine
      alias: redis
  variables:
    POSTGRES_DB: loka_test
    POSTGRES_USER: loka
    POSTGRES_PASSWORD: loka
    DATABASE_URL: postgis://loka:loka@postgres:5432/loka_test
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    DJANGO_SETTINGS_MODULE: config.settings.test
    DJANGO_SECRET_KEY: ci-secret
  script:
    - pytest --cov --cov-report=term --cov-report=xml
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: apps/api/coverage.xml

test:web:
  extends: .web-base
  stage: test
  script:
    - npm run test -- --run

.build-image:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

build:api:
  extends: .build-image
  script:
    - docker build -f infra/docker/api.Dockerfile --target prod -t "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHORT_SHA" apps/api
    - docker push "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHORT_SHA"

build:web:
  extends: .build-image
  script:
    - docker build -f infra/docker/web.Dockerfile --target prod --build-arg NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" -t "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHORT_SHA" apps/web
    - docker push "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHORT_SHA"

deploy:prod:
  stage: deploy
  image: alpine:3.20
  script:
    - echo "Deploiement a cabler (SSH + docker compose pull/up). Voir docs/architecture.md."
  when: manual
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
