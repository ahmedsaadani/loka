# Blueprint Render — déploiement de TEST du back-end Loka (API + PostGIS + Redis + MinIO).
# Le front Next.js est déployé séparément sur Vercel (voir docs/deploy-test.md).
#
# Mise en service : Render Dashboard > New > Blueprint > connecter github.com/<vous>/loka.
# Render lit ce fichier et crée les 4 services. Renseigner ensuite les variables marquées
# « sync: false » (URL MinIO, origine Vercel) une fois les URLs connues — tout est détaillé
# dans docs/deploy-test.md.
#
# Choix assumés pour rester gratuit :
#  - Celery en mode synchrone (CELERY_TASK_ALWAYS_EAGER=1) : pas de worker séparé (payant).
#  - MinIO sans disque : les fichiers sont perdus à la mise en veille ; relancer `seed`.
#    Pour des photos persistantes, attacher un disque au service loka-minio (option payante).

databases:
  - name: loka-db
    plan: free
    postgresMajorVersion: "16"

services:
  # ---------------------------------------------------------------- Redis (cache + broker)
  - type: redis
    name: loka-redis
    plan: free
    ipAllowList: [] # accès interne uniquement

  # ---------------------------------------------------------------- Stockage S3 (MinIO)
  - type: web
    name: loka-minio
    runtime: docker
    plan: free
    dockerfilePath: ./infra/deploy/render/minio.Dockerfile
    dockerContext: .
    healthCheckPath: /minio/health/live
    # Pour rendre les photos persistantes (option payante), décommenter :
    # disk:
    #   name: loka-minio-data
    #   mountPath: /data
    #   sizeGB: 1
    envVars:
      - key: MINIO_ROOT_USER
        generateValue: true
      - key: MINIO_ROOT_PASSWORD
        generateValue: true
      - key: S3_BUCKET_PUBLIC
        value: loka-public
      - key: S3_BUCKET_PRIVATE
        value: loka-private

  # ---------------------------------------------------------------- API Django (gunicorn)
  - type: web
    name: loka-api
    runtime: docker
    plan: free
    dockerfilePath: ./infra/docker/api.Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /api/v1/health/
    # Runtime Docker : le plan gratuit n'accepte ni startCommand ni preDeployCommand.
    # Un script de démarrage (dans l'image, sous /app) enchaîne PostGIS + migrations +
    # statiques + gunicorn ; évite tout souci d'échappement de guillemets côté Render.
    dockerCommand: sh render-start.sh
    envVars:
      - key: ENVIRONMENT
        value: prod
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_DEBUG
        value: "0"
      # Si l'API refuse de démarrer sur la clé, remplacer par `openssl rand -hex 32` (64 car.).
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # L'hôte public Render (RENDER_EXTERNAL_HOSTNAME) est ajouté automatiquement par les réglages.
      - key: DJANGO_ALLOWED_HOSTS
        value: localhost,127.0.0.1
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "1"
      # Limites anti-spam assouplies pour ce déploiement de test (inscription, formulaire hôte).
      - key: THROTTLE_REGISTER
        value: 100/hour
      - key: THROTTLE_OWNER_CONTACT
        value: 100/hour
      - key: DATABASE_URL
        fromDatabase:
          name: loka-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: loka-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: loka-redis
          property: connectionString
      - key: S3_ACCESS_KEY
        fromService:
          type: web
          name: loka-minio
          envVarKey: MINIO_ROOT_USER
      - key: S3_SECRET_KEY
        fromService:
          type: web
          name: loka-minio
          envVarKey: MINIO_ROOT_PASSWORD
      - key: S3_BUCKET_PUBLIC
        value: loka-public
      - key: S3_BUCKET_PRIVATE
        value: loka-private
      # URL publique HTTPS du service loka-minio (stockage).
      - key: S3_ENDPOINT_URL
        value: https://loka-minio.onrender.com
      - key: S3_PUBLIC_ENDPOINT_URL
        value: https://loka-minio.onrender.com
      # Front sur Render (loka-web) : origine exacte + regex tolérante à un suffixe d'URL.
      - key: CORS_ALLOWED_ORIGINS
        value: https://loka-web.onrender.com
      - key: CORS_ALLOWED_ORIGIN_REGEXES
        value: '^https://loka-web[a-z0-9-]*\.onrender\.com$'
      - key: SITE_URL
        value: https://loka-web.onrender.com
      # Revalidation ISR désactivée sur ce test (pages en rendu dynamique). Laisser vide.
      - key: REVALIDATE_URL
        sync: false
      - key: REVALIDATE_SECRET
        generateValue: true

  # ---------------------------------------------------------------- Front Next.js
  - type: web
    name: loka-web
    runtime: docker
    plan: free
    dockerfilePath: ./infra/docker/web.Dockerfile
    dockerContext: ./apps/web
    healthCheckPath: /
    envVars:
      # Variables NEXT_PUBLIC_* figées au build (Render les passe comme build args Docker).
      - key: NEXT_PUBLIC_API_URL
        value: https://loka-api-qhix.onrender.com/api/v1
      - key: API_INTERNAL_URL
        value: https://loka-api-qhix.onrender.com/api/v1
      - key: NEXT_PUBLIC_SITE_URL
        value: https://loka-web.onrender.com
      - key: NEXT_PUBLIC_S3_PUBLIC_URL
        value: https://loka-minio.onrender.com
      # Fond de carte OpenStreetMap (aucune clé MapTiler nécessaire pour ce test).
      - key: NEXT_PUBLIC_MAP_FALLBACK_OSM
        value: "1"
